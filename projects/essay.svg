<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Document mockup -->
  <rect x="120" y="30" width="360" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="58" fill="#60a5fa" font-size="12" font-family="sans-serif" font-weight="bold">Essay Input</text>
  <!-- Text lines -->
  <rect x="145" y="72" width="300" height="6" rx="3" fill="#334155"/><rect x="145" y="86" width="280" height="6" rx="3" fill="#334155"/>
  <rect x="145" y="100" width="310" height="6" rx="3" fill="#334155"/><rect x="145" y="114" width="250" height="6" rx="3" fill="#334155"/>
  <rect x="145" y="128" width="290" height="6" rx="3" fill="#334155"/><rect x="145" y="142" width="270" height="6" rx="3" fill="#334155"/>
  <rect x="145" y="156" width="300" height="6" rx="3" fill="#334155"/><rect x="145" y="170" width="220" height="6" rx="3" fill="#334155"/>
  <!-- Highlighted issues -->
  <rect x="145" y="96" width="80" height="14" rx="2" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="0.5"/>
  <rect x="280" y="124" width="60" height="14" rx="2" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="0.5"/>
  <rect x="200" y="152" width="90" height="14" rx="2" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.5"/>
  <!-- Score panel -->
  <rect x="145" y="195" width="310" height="100" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="170" y="218" fill="#60a5fa" font-size="11" font-family="sans-serif" font-weight="bold">AI Evaluation Score</text>
  <text x="170" y="245" fill="#22c55e" font-size="10" font-family="monospace">Grammar:    ████████░░  82%</text>
  <text x="170" y="262" fill="#06b6d4" font-size="10" font-family="monospace">Coherence:  █████████░  88%</text>
  <text x="170" y="279" fill="#f59e0b" font-size="10" font-family="monospace">Structure:  ███████░░░  75%</text>
  <!-- AI Brain -->
  <rect x="520" y="50" width="230" height="240" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="550" y="78" fill="#06b6d4" font-size="12" font-family="sans-serif" font-weight="bold">LLaMA Engine</text>
  <!-- Neural network visualization -->
  <circle cx="570" cy="130" r="8" fill="#3b82f6" opacity="0.6"/><circle cx="570" cy="170" r="8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="570" cy="210" r="8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="635" cy="120" r="8" fill="#06b6d4" opacity="0.6"/><circle cx="635" cy="160" r="8" fill="#06b6d4" opacity="0.6"/>
  <circle cx="635" cy="200" r="8" fill="#06b6d4" opacity="0.6"/><circle cx="635" cy="240" r="8" fill="#06b6d4" opacity="0.6"/>
  <circle cx="700" cy="140" r="8" fill="#22c55e" opacity="0.6"/><circle cx="700" cy="180" r="8" fill="#22c55e" opacity="0.6"/>
  <circle cx="700" cy="220" r="8" fill="#22c55e" opacity="0.6"/>
  <!-- Connections -->
  <g stroke="#3b82f6" stroke-width="0.8" opacity="0.3">
    <line x1="578" y1="130" x2="627" y2="120"/><line x1="578" y1="130" x2="627" y2="160"/>
    <line x1="578" y1="170" x2="627" y2="160"/><line x1="578" y1="170" x2="627" y2="200"/>
    <line x1="578" y1="210" x2="627" y2="200"/><line x1="578" y1="210" x2="627" y2="240"/>
    <line x1="643" y1="120" x2="692" y2="140"/><line x1="643" y1="160" x2="692" y2="140"/>
    <line x1="643" y1="160" x2="692" y2="180"/><line x1="643" y1="200" x2="692" y2="180"/>
    <line x1="643" y1="200" x2="692" y2="220"/><line x1="643" y1="240" x2="692" y2="220"/>
  </g>
  <!-- Processing indicator -->
  <text x="555" y="268" fill="#94a3b8" font-size="9" font-family="monospace">Processing... ██████░░ 70%</text>
  <!-- Arrow -->
  <line x1="485" y1="170" x2="515" y2="170" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="515,165 525,170 515,175" fill="#60a5fa"/>
  <!-- Label -->
  <text x="400" y="360" fill="url(#accent)" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">LLM ESSAY FEEDBACK SYSTEM</text>
  <text x="400" y="380" fill="#64748b" font-size="12" font-family="monospace" text-anchor="middle">LLaMA • NLP • Automated Evaluation</text>
</svg>
