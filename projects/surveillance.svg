<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  <!-- Camera icon -->
  <rect x="300" y="100" width="200" height="130" rx="12" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="160" r="30" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="400" cy="160" r="12" fill="#3b82f6" opacity="0.3"/>
  <rect x="330" y="105" width="40" height="12" rx="3" fill="#3b82f6" opacity="0.4"/>
  <!-- Detection boxes -->
  <rect x="100" y="180" width="80" height="120" rx="4" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="115" y="175" fill="#22c55e" font-size="11" font-family="monospace" opacity="0.8">Person</text>
  <rect x="620" y="160" width="70" height="130" rx="4" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="630" y="155" fill="#22c55e" font-size="11" font-family="monospace" opacity="0.8">Person</text>
  <!-- Dashboard panel -->
  <rect x="50" y="30" width="160" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <text x="70" y="52" fill="#60a5fa" font-size="11" font-family="sans-serif">Live Analytics</text>
  <rect x="65" y="60" width="60" height="8" rx="4" fill="#3b82f6" opacity="0.5"/>
  <rect x="65" y="74" width="40" height="8" rx="4" fill="#06b6d4" opacity="0.5"/>
  <rect x="65" y="88" width="80" height="8" rx="4" fill="#22c55e" opacity="0.4"/>
  <!-- Alert badge -->
  <rect x="580" y="30" width="170" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" opacity="0.8"/>
  <circle cx="600" cy="55" r="8" fill="#ef4444" opacity="0.8"/>
  <text x="615" y="52" fill="#f87171" font-size="10" font-family="sans-serif">ALERT: Fight Detected</text>
  <text x="615" y="68" fill="#94a3b8" font-size="9" font-family="monospace">Confidence: 93%</text>
  <!-- Label -->
  <text x="400" y="360" fill="url(#accent)" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">AI SURVEILLANCE SYSTEM</text>
  <text x="400" y="380" fill="#64748b" font-size="12" font-family="monospace" text-anchor="middle">YOLOv8 • Real-time Detection</text>
</svg>
