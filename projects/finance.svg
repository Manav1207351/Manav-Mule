<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- Dashboard mockup -->
  <rect x="80" y="30" width="640" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="80" y="30" width="640" height="40" rx="12" fill="#1e293b"/>
  <rect x="80" y="58" width="640" height="12" fill="#1e293b"/>
  <circle cx="105" cy="50" r="6" fill="#ef4444" opacity="0.7"/>
  <circle cx="125" cy="50" r="6" fill="#fbbf24" opacity="0.7"/>
  <circle cx="145" cy="50" r="6" fill="#22c55e" opacity="0.7"/>
  <text x="400" y="54" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">Smart Finance AI Dashboard</text>
  <!-- Sidebar -->
  <rect x="80" y="70" width="120" height="260" fill="#1e293b"/>
  <rect x="95" y="90" width="90" height="10" rx="3" fill="#3b82f6" opacity="0.4"/>
  <rect x="95" y="112" width="70" height="10" rx="3" fill="#334155"/>
  <rect x="95" y="134" width="80" height="10" rx="3" fill="#334155"/>
  <rect x="95" y="156" width="60" height="10" rx="3" fill="#334155"/>
  <rect x="95" y="178" width="75" height="10" rx="3" fill="#334155"/>
  <!-- Chart area -->
  <rect x="220" y="85" width="240" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="240" y="105" fill="#60a5fa" font-size="10" font-family="sans-serif">Monthly Spending</text>
  <!-- Bar chart -->
  <rect x="245" y="170" width="20" height="30" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="275" y="150" width="20" height="50" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="305" y="130" width="20" height="70" rx="2" fill="#3b82f6"/>
  <rect x="335" y="145" width="20" height="55" rx="2" fill="#06b6d4" opacity="0.8"/>
  <rect x="365" y="160" width="20" height="40" rx="2" fill="#06b6d4" opacity="0.7"/>
  <rect x="395" y="135" width="20" height="65" rx="2" fill="#22c55e"/>
  <rect x="425" y="150" width="20" height="50" rx="2" fill="#22c55e" opacity="0.7"/>
  <!-- Pie chart -->
  <rect x="480" y="85" width="220" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="105" fill="#60a5fa" font-size="10" font-family="sans-serif">Budget Allocation</text>
  <circle cx="560" cy="160" r="40" fill="none" stroke="#3b82f6" stroke-width="20" stroke-dasharray="75,176" stroke-dashoffset="0"/>
  <circle cx="560" cy="160" r="40" fill="none" stroke="#06b6d4" stroke-width="20" stroke-dasharray="50,201" stroke-dashoffset="-75"/>
  <circle cx="560" cy="160" r="40" fill="none" stroke="#22c55e" stroke-width="20" stroke-dasharray="40,211" stroke-dashoffset="-125"/>
  <circle cx="560" cy="160" r="40" fill="none" stroke="#f59e0b" stroke-width="20" stroke-dasharray="86,165" stroke-dashoffset="-165"/>
  <!-- Stats -->
  <rect x="220" y="230" width="150" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="240" y="253" fill="#94a3b8" font-size="10" font-family="sans-serif">Savings</text>
  <text x="240" y="278" fill="#22c55e" font-size="20" font-family="sans-serif" font-weight="bold">+25%</text>
  <text x="240" y="296" fill="#64748b" font-size="9" font-family="monospace">↑ Optimized</text>
  <rect x="390" y="230" width="150" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="253" fill="#94a3b8" font-size="10" font-family="sans-serif">Anomalies</text>
  <text x="410" y="278" fill="#f59e0b" font-size="20" font-family="sans-serif" font-weight="bold">3</text>
  <text x="410" y="296" fill="#64748b" font-size="9" font-family="monospace">Detected this month</text>
  <rect x="560" y="230" width="145" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="580" y="253" fill="#94a3b8" font-size="10" font-family="sans-serif">AI Score</text>
  <text x="580" y="278" fill="#3b82f6" font-size="20" font-family="sans-serif" font-weight="bold">92/100</text>
  <text x="580" y="296" fill="#64748b" font-size="9" font-family="monospace">Financial Health</text>
  <!-- Label -->
  <text x="400" y="360" fill="url(#accent)" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">SMART FINANCE AI</text>
  <text x="400" y="380" fill="#64748b" font-size="12" font-family="monospace" text-anchor="middle">ML • Anomaly Detection • Power BI</text>
</svg>
