<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Road -->
  <path d="M200,400 L350,180 L450,180 L600,400" fill="#334155" stroke="#475569" stroke-width="1"/>
  <line x1="380" y1="400" x2="392" y2="200" stroke="#fbbf24" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- Steering wheel -->
  <circle cx="400" cy="310" r="60" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.7"/>
  <circle cx="400" cy="310" r="8" fill="#3b82f6" opacity="0.5"/>
  <line x1="400" y1="250" x2="400" y2="270" stroke="#60a5fa" stroke-width="2"/>
  <line x1="400" y1="350" x2="400" y2="370" stroke="#60a5fa" stroke-width="2"/>
  <line x1="340" y1="310" x2="360" y2="310" stroke="#60a5fa" stroke-width="2"/>
  <line x1="440" y1="310" x2="460" y2="310" stroke="#60a5fa" stroke-width="2"/>
  <!-- Eye detection panel -->
  <rect x="50" y="40" width="200" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="65" fill="#60a5fa" font-size="12" font-family="sans-serif" font-weight="bold">Driver Status</text>
  <!-- Eye icons -->
  <ellipse cx="110" cy="95" rx="20" ry="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="110" cy="95" r="6" fill="#22c55e" opacity="0.5"/>
  <ellipse cx="170" cy="95" rx="20" ry="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <circle cx="170" cy="95" r="6" fill="#22c55e" opacity="0.5"/>
  <text x="80" y="130" fill="#22c55e" font-size="11" font-family="monospace">Status: ALERT</text>
  <rect x="80" y="138" width="140" height="6" rx="3" fill="#1e3a5f"/>
  <rect x="80" y="138" width="130" height="6" rx="3" fill="#22c55e"/>
  <!-- Traffic sign panel -->
  <rect x="550" y="40" width="200" height="120" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="580" y="65" fill="#06b6d4" font-size="12" font-family="sans-serif" font-weight="bold">Sign Detection</text>
  <!-- Stop sign -->
  <polygon points="650,80 670,80 680,95 670,110 650,110 640,95" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="647" y="100" fill="#ef4444" font-size="8" font-family="sans-serif" font-weight="bold">STOP</text>
  <text x="580" y="135" fill="#94a3b8" font-size="10" font-family="monospace">Confidence: 95%</text>
  <rect x="580" y="142" width="140" height="6" rx="3" fill="#1e3a5f"/>
  <rect x="580" y="142" width="133" height="6" rx="3" fill="#06b6d4"/>
  <!-- Label -->
  <text x="400" y="360" fill="url(#accent)" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">CARVIS – AI DRIVER ASSISTANT</text>
  <text x="400" y="380" fill="#64748b" font-size="12" font-family="monospace" text-anchor="middle">CNN • Drowsiness Detection • Sign Recognition</text>
</svg>
